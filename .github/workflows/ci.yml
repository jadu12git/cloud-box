name: Build, unit tests and Docker integration

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B test
      - run: mvn -B -DskipTests package

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and start PostgreSQL, coordinator, and three storage nodes
        run: docker compose up -d --build --wait
      - name: Run live distributed storage integration suite
        run: python3 tests/integration_test.py
      - name: Collect Docker logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=150
      - name: Stop containers (keep volumes unless runner is destroyed)
        if: always()
        run: docker compose down
