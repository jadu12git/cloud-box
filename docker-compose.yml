x-app-env: &app-env
  DATABASE_URL: jdbc:postgresql://postgres:5432/cloudbox
  DATABASE_USER: cloudbox
  DATABASE_PASSWORD: ${DB_PASSWORD:-cloudbox_dev_password}
  STORAGE_NODES: http://node1:8080,http://node2:8080,http://node3:8080
  REPLICATION_FACTOR: 2
  CHUNK_SIZE: 1048576
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cloudbox
      POSTGRES_USER: cloudbox
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cloudbox_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudbox -d cloudbox"]
      interval: 5s
      timeout: 3s
      retries: 20
  coordinator:
    build: .
    environment:
      <<: *app-env
      CLOUDBOX_ROLE: coordinator
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
  node1:
    build: .
    environment:
      <<: *app-env
      CLOUDBOX_ROLE: storage
      DATA_DIR: /data
    volumes:
      - node1_data:/data
    depends_on:
      postgres:
        condition: service_healthy
  node2:
    build: .
    environment:
      <<: *app-env
      CLOUDBOX_ROLE: storage
      DATA_DIR: /data
    volumes:
      - node2_data:/data
    depends_on:
      postgres:
        condition: service_healthy
  node3:
    build: .
    environment:
      <<: *app-env
      CLOUDBOX_ROLE: storage
      DATA_DIR: /data
    volumes:
      - node3_data:/data
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
  node1_data:
  node2_data:
  node3_data: